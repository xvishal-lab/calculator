  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(\"d5484979-ecf7-40eb-bf3d-9bcb6e71fc3b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"956d3010-c053-4fcb-bd7b-5597c23381a3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2638e4a7-3395-494f-a359-4db882c4acbb\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1e23ca8b-2396-4c84-87cc-1954f205d398\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3905e6cf-a2e4-45c8-adf2-3f06cff3611d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --ink: oklch(0.22 0.012 70);\n    --ink-soft: oklch(0.46 0.012 70);\n    --ink-faint: oklch(0.62 0.01 70);\n    --paper: oklch(0.965 0.006 80);\n    --panel: oklch(0.995 0.003 80);\n    --line: oklch(0.89 0.008 80);\n    --line-soft: oklch(0.93 0.006 80);\n    --accent: oklch(0.62 0.17 32);\n    --accent-soft: oklch(0.95 0.03 40);\n    --mono: 'JetBrains Mono', ui-monospace, monospace;\n    --sans: 'Space Grotesk', system-ui, sans-serif;\n  }\n  *{box-sizing:border-box}\n  html,body{height:100%}\n  body{\n    margin:0;\n    font-family:var(--sans);\n    color:var(--ink);\n    background:var(--paper);\n    -webkit-font-smoothing:antialiased;\n  }\n  .app{\n    display:grid;\n    grid-template-columns: 1fr 392px;\n    height:100vh;\n    min-height:0;\n  }\n\n  /* ===================== STAGE (left) ===================== */\n  .stage{\n    position:relative;\n    display:flex;\n    flex-direction:column;\n    min-width:0;\n    overflow:hidden;\n  }\n  .stage-top{\n    display:flex;\n    align-items:baseline;\n    justify-content:space-between;\n    gap:16px;\n    padding:22px 28px 0;\n    flex:none;\n    z-index:2;\n  }\n  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\n  .brand h1{\n    font-size:17px;\n    font-weight:600;\n    letter-spacing:-0.01em;\n    margin:0;\n  }\n  .brand .tag{\n    font-family:var(--mono);\n    font-size:10.5px;\n    letter-spacing:0.14em;\n    text-transform:uppercase;\n    color:var(--ink-faint);\n    border:1px solid var(--line);\n    padding:3px 8px;\n    border-radius:999px;\n  }\n  .stage-meta{\n    font-family:var(--mono);\n    font-size:11px;\n    color:var(--ink-faint);\n    letter-spacing:0.02em;\n  }\n  .stage-canvas{\n    position:relative;\n    flex:1;\n    min-height:0;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    padding:32px;\n  }\n\n  /* ===================== CALCULATOR ===================== */\n  .calc-stage{\n    position:absolute;\n    inset:0;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    transition: background .25s ease;\n  }\n  #calc{\n    --bg:#e9e6df;\n    --bg2:#cfd8dc;\n    --body:#f6f4ef;\n    --body-radius:34px;\n    --body-pad:22px;\n    --body-shadow: 0 30px 60px -28px rgba(0,0,0,.35);\n    --body-border-w:0px;\n    --body-border-c:#000000;\n    --disp-bg:#f6f4ef;\n    --disp-text:#1d1d1f;\n    --disp-h:128px;\n    --disp-radius:16px;\n    --disp-align:right;\n    --disp-font:'Space Grotesk', sans-serif;\n    --disp-size:52px;\n    --btn-bg:#ffffff;\n    --op-bg:#ff9f0a;\n    --eq-bg:#ff9f0a;\n    --fn-bg:#d9d4ca;\n    --btn-text:#1d1d1f;\n    --accent-text:#ffffff;\n    --btn-radius:16px;\n    --btn-gap:11px;\n    --btn-h:62px;\n    --btn-font:'Space Grotesk', sans-serif;\n    --btn-weight:500;\n    --btn-size:23px;\n    --btn-border-w:0px;\n    --btn-border-c:#000000;\n\n    width:340px;\n    background:var(--body);\n    border-radius:var(--body-radius);\n    padding:var(--body-pad);\n    box-shadow:var(--body-shadow);\n    border:var(--body-border-w) solid var(--body-border-c);\n    transition: background .2s ease, border-radius .2s ease, padding .2s ease, box-shadow .25s ease;\n  }\n  .display{\n    height:var(--disp-h);\n    background:var(--disp-bg);\n    color:var(--disp-text);\n    border-radius:var(--disp-radius);\n    display:flex;\n    flex-direction:column;\n    justify-content:flex-end;\n    align-items:stretch;\n    text-align:var(--disp-align);\n    padding:14px 18px;\n    margin-bottom:var(--btn-gap);\n    overflow:hidden;\n    transition: background .2s ease, height .2s ease, border-radius .2s ease;\n  }\n  .display .secondary{\n    font-family:var(--disp-font);\n    font-size:calc(var(--disp-size) * 0.34);\n    color:var(--disp-text);\n    opacity:.45;\n    min-height:1.1em;\n    line-height:1.2;\n    white-space:nowrap;\n    overflow:hidden;\n    text-overflow:ellipsis;\n    display:none;\n  }\n  #calc.show-secondary .display .secondary{display:block}\n  .display .primary{\n    font-family:var(--disp-font);\n    font-size:var(--disp-size);\n    line-height:1.05;\n    font-weight:500;\n    letter-spacing:-0.01em;\n    white-space:nowrap;\n    overflow:hidden;\n    text-overflow:ellipsis;\n    transition: font-size .15s ease;\n  }\n  .keys{\n    display:grid;\n    grid-template-columns:repeat(4,1fr);\n    gap:var(--btn-gap);\n  }\n  .btn{\n    -webkit-appearance:none;\n    appearance:none;\n    cursor:pointer;\n    border:var(--btn-border-w) solid var(--btn-border-c);\n    border-radius:var(--btn-radius);\n    min-height:var(--btn-h);\n    background:var(--btn-bg);\n    color:var(--btn-text);\n    font-family:var(--btn-font);\n    font-weight:var(--btn-weight);\n    font-size:var(--btn-size);\n    letter-spacing:-0.01em;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    user-select:none;\n    transition: transform .06s ease, box-shadow .12s ease, filter .12s ease, background .15s ease;\n  }\n  .btn.op{background:var(--op-bg); color:var(--accent-text)}\n  .btn.eq{background:var(--eq-bg); color:var(--accent-text)}\n  .btn.fn{background:var(--fn-bg); color:var(--btn-text)}\n  .btn:hover{filter:brightness(1.04)}\n  .btn:active{filter:brightness(0.95)}\n\n  /* spans */\n  .wide-zero .k-zero{grid-column:span 2}\n  .wide-eq .k-eq{grid-column:span 2}\n\n  /* shapes */\n  #calc.shape-circle .btn{aspect-ratio:1; min-height:0; border-radius:999px}\n  #calc.shape-circle .k-zero,\n  #calc.shape-circle .k-eq{aspect-ratio:auto}\n\n  /* button style: raised */\n  #calc[data-btnstyle=\"raised\"] .btn{\n    box-shadow:0 4px 0 rgba(0,0,0,.16), 0 6px 12px -4px rgba(0,0,0,.25);\n  }\n  #calc[data-btnstyle=\"raised\"] .btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.16)}\n  /* button style: neumorphic */\n  #calc[data-btnstyle=\"neu\"] .btn{\n    box-shadow: 5px 5px 11px rgba(0,0,0,.16), -5px -5px 11px rgba(255,255,255,.7);\n    border:none;\n  }\n  #calc[data-btnstyle=\"neu\"] .btn:active{\n    box-shadow: inset 4px 4px 9px rgba(0,0,0,.18), inset -4px -4px 9px rgba(255,255,255,.7);\n  }\n  /* press effects */\n  #calc[data-press=\"push\"] .btn:active{transform:translateY(2px) scale(.98)}\n  #calc[data-press=\"glow\"] .btn:active{box-shadow:0 0 0 3px var(--eq-bg), 0 0 22px -2px var(--eq-bg)}\n\n  /* ===================== CONTROL PANEL (right) ===================== */\n  .panel{\n    background:var(--panel);\n    border-left:1px solid var(--line);\n    display:flex;\n    flex-direction:column;\n    min-height:0;\n  }\n  .panel-head{\n    flex:none;\n    padding:16px 18px 14px;\n    border-bottom:1px solid var(--line);\n    display:flex;\n    flex-direction:column;\n    gap:12px;\n  }\n  .panel-head .ph-title{\n    display:flex;\n    align-items:center;\n    gap:8px;\n    font-family:var(--mono);\n    font-size:11px;\n    letter-spacing:0.16em;\n    text-transform:uppercase;\n    color:var(--ink-soft);\n  }\n  .panel-head .ph-title .dot{\n    width:8px;height:8px;border-radius:50%;\n    background:var(--accent);\n    box-shadow:0 0 0 3px var(--accent-soft);\n  }\n  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}\n  .act{\n    font-family:var(--mono);\n    font-size:10.5px;\n    letter-spacing:0.06em;\n    text-transform:uppercase;\n    padding:9px 6px;\n    border:1px solid var(--line);\n    background:var(--panel);\n    color:var(--ink);\n    border-radius:9px;\n    cursor:pointer;\n    transition:all .14s ease;\n    display:flex;align-items:center;justify-content:center;gap:5px;\n  }\n  .act:hover{border-color:var(--ink-faint);background:var(--paper)}\n  .act.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}\n  .act.primary:hover{filter:brightness(1.25)}\n\n  .panel-body{\n    flex:1;\n    min-height:0;\n    overflow-y:auto;\n    padding:4px 0 40px;\n    scrollbar-width:thin;\n    scrollbar-color: var(--line) transparent;\n  }\n  .panel-body::-webkit-scrollbar{width:9px}\n  .panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:3px solid var(--panel)}\n\n  .section{border-bottom:1px solid var(--line-soft)}\n  .sec-head{\n    width:100%;\n    text-align:left;\n    background:none;border:none;cursor:pointer;\n    padding:15px 18px 11px;\n    display:flex;align-items:center;justify-content:space-between;\n    font-family:var(--mono);\n    font-size:10.5px;\n    letter-spacing:0.16em;\n    text-transform:uppercase;\n    color:var(--ink-soft);\n  }\n  .sec-head .num{color:var(--ink-faint);font-size:10px}\n  .sec-head .chev{transition:transform .2s ease;color:var(--ink-faint)}\n  .section.collapsed .chev{transform:rotate(-90deg)}\n  .sec-body{padding:2px 18px 16px;display:flex;flex-direction:column;gap:13px}\n  .section.collapsed .sec-body{display:none}\n\n  /* preset chips */\n  .presets{display:flex;flex-wrap:wrap;gap:6px;padding:2px 18px 17px}\n  .chip{\n    font-family:var(--mono);\n    font-size:11px;\n    letter-spacing:0.02em;\n    padding:7px 11px;\n    border:1px solid var(--line);\n    border-radius:999px;\n    background:var(--panel);\n    cursor:pointer;\n    transition:all .14s ease;\n  }\n  .chip:hover{border-color:var(--ink-faint)}\n  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}\n\n  /* control row */\n  .ctrl{display:flex;flex-direction:column;gap:7px}\n  .ctrl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}\n  .ctrl label{\n    font-size:12.5px;\n    font-weight:500;\n    color:var(--ink);\n    letter-spacing:-0.005em;\n  }\n  .ctrl .val{\n    font-family:var(--mono);\n    font-size:11px;\n    color:var(--ink-faint);\n    min-width:42px;\n    text-align:right;\n  }\n\n  /* range */\n  input[type=range]{\n    -webkit-appearance:none;appearance:none;\n    width:100%;height:4px;border-radius:4px;\n    background:var(--line);\n    outline:none;cursor:pointer;\n  }\n  input[type=range]::-webkit-slider-thumb{\n    -webkit-appearance:none;appearance:none;\n    width:16px;height:16px;border-radius:50%;\n    background:var(--panel);\n    border:2px solid var(--ink);\n    box-shadow:0 1px 3px rgba(0,0,0,.2);\n ize:23, btnBorderW:0, btnStyle:'flat',\n    press:'push', wideKey:'zero'\n  },\n};\n\n/* ============================================================\n   APPLY FUNCTIONS\n============================================================ */\nfunction applyControl(ctrl, value){\n  state[ctrl.id] = value;\n  if(ctrl.cssVar) calc.style.setProperty(ctrl.cssVar, value + (ctrl.unit !== undefined ? ctrl.unit : ''));\n  if(ctrl.fontVar) calc.style.setProperty(ctrl.fontVar, FONTS[value]);\n  if(ctrl.attr) calc.setAttribute(ctrl.attr, value);\n  if(ctrl.cls) calc.classList.toggle(ctrl.cls, !!value);\n  if(ctrl.apply) ctrl.apply(value);\n}\n\nfunction updateBackdrop(){\n  const stg = document.getElementById('calcStage');\n  const s = state.bgStyle, a = state.bg, b = state.bg2;\n  if(s === 'solid'){\n    stg.style.background = a;\n  } else if(s === 'gradient'){\n    stg.style.background = `linear-gradient(145deg, ${a}, ${b})`;\n  } else { // grid\n    stg.style.background = `${a}`;\n    stg.style.backgroundImage =\n      `linear-gradient(${b} 1px, transparent 1px), linear-gradient(90deg, ${b} 1px, transparent 1px)`;\n    stg.style.backgroundSize = '26px 26px';\n    return;\n  }\n  stg.style.backgroundImage = '';\n  stg.style.backgroundSize = '';\n}\n\nfunction updateBodyShadow(lvl){\n  const map = {\n    0:'none',\n    1:'0 6px 16px -10px rgba(0,0,0,.30)',\n    2:'0 14px 30px -18px rgba(0,0,0,.35)',\n    3:'0 30px 60px -28px rgba(0,0,0,.40)',\n    4:'0 40px 80px -30px rgba(0,0,0,.50)',\n    5:'0 55px 110px -30px rgba(0,0,0,.62)',\n  };\n  calc.style.setProperty('--body-shadow', map[lvl] || map[3]);\n}\n\nfunction updateShape(v){\n  calc.classList.toggle('shape-circle', v === 'circle');\n  const r = { sharp:0, soft:16, pill:999, circle:999 }[v];\n  // sync the radius slider + value\n  setControlValue('btnRadius', r);\n  calc.style.setProperty('--btn-radius', r + 'px');\n}\n\nfunction updateWideKey(v){\n  calc.classList.toggle('wide-zero', v === 'zero');\n  calc.classList.toggle('wide-eq', v === 'equals');\n}\n\n/* ============================================================\n   RENDER PANEL\n============================================================ */\nconst panelBody = document.getElementById('panelBody');\n\nfunction renderPresets(){\n  const wrap = document.getElementById('presets');\n  Object.keys(PRESETS).forEach((name, i) => {\n    const c = document.createElement('button');\n    c.className = 'chip' + (i===0 ? ' active' : '');\n    c.textContent = name;\n    c.dataset.preset = name;\n    c.addEventListener('click', () => applyPreset(name, c));\n    wrap.appendChild(c);\n  });\n}\n\nfunction renderSections(){\n  SECTIONS.forEach((sec, si) => {\n    const section = document.createElement('section');\n    section.className = 'section';\n    const head = document.createElement('button');\n    head.className = 'sec-head';\n    head.innerHTML = `<span><span class=\"num\">${String(si+1).padStart(2,'0')} · <\u002Fspan>${sec.title}<\u002Fspan>\n      <svg class=\"chev\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M6 9l6 6 6-6\"/><\u002Fsvg>`;\n    head.addEventListener('click', () => section.classList.toggle('collapsed'));\n    section.appendChild(head);\n\n    const body = document.createElement('div');\n    body.className = 'sec-body';\n    sec.controls.forEach(ctrl => body.appendChild(renderControl(ctrl)));\n    section.appendChild(body);\n    panelBody.appendChild(section);\n  });\n}\n\nfunction renderControl(ctrl){\n  const row = document.createElement('div');\n  row.className = 'ctrl';\n  row.dataset.ctrl = ctrl.id;\n\n  if(ctrl.type === 'range'){\n    row.innerHTML = `<div class=\"ctrl-top\"><label>${ctrl.label}<\u002Flabel><span class=\"val\" data-val><\u002Fspan><\u002Fdiv>`;\n    const inp = document.createElement('input');\n    inp.type = 'range'; inp.min = ctrl.min; inp.max = ctrl.max; inp.step = ctrl.step || 1;\n    inp.value = ctrl.def;\n    const valEl = row.querySelector('[data-val]');\n    valEl.textContent = ctrl.def + (ctrl.unit || '');\n    inp.addEventListener('input', () => {\n      valEl.textContent = inp.value + (ctrl.unit || '');\n      applyControl(ctrl, inp.value);\n      clearPresetActive();\n    });\n    row._set = (v) => { inp.value = v; valEl.textContent = v + (ctrl.unit || ''); };\n    row.appendChild(inp);\n\n  } else if(ctrl.type === 'color'){\n    row.innerHTML = `<div class=\"ctrl-top\"><label>${ctrl.label}<\u002Flabel><\u002Fdiv>`;\n    const wrap = document.createElement('div'); wrap.className = 'color-wrap';\n    const sw = document.createElement('div'); sw.className = 'swatch';\n    const inp = document.createElement('input'); inp.type = 'color'; inp.value = ctrl.def;\n    sw.style.background = ctrl.def;\n    const hex = document.createElement('input'); hex.type = 'text'; hex.className = 'hex'; hex.value = ctrl.def;\n    sw.appendChild(inp);\n    const sync = (v) => {\n      sw.style.background = v; hex.value = v; inp.value = v;\n      applyControl(ctrl, v); clearPresetActive();\n    };\n    inp.addEventListener('input', () => sync(inp.value));\n    hex.addEventListener('change', () => {\n      let v = hex.value.trim(); if(!v.startsWith('#')) v = '#'+v;\n      if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) sync(v); else hex.value = state[ctrl.id];\n    });\n    wrap.appendChild(sw); wrap.appendChild(hex);\n    row.appendChild(wrap);\n    row._set = (v) => { sw.style.background = v; hex.value = v; inp.value = v; };\n\n  } else if(ctrl.type === 'seg'){\n    row.innerHTML = `<div class=\"ctrl-top\"><label>${ctrl.label}<\u002Flabel><\u002Fdiv>`;\n    const seg = document.createElement('div'); seg.className = 'seg';\n    ctrl.options.forEach(([lab, val]) => {\n      const b = document.createElement('button');\n      b.textContent = lab; b.dataset.v = val;\n      if(val === ctrl.def) b.classList.add('active');\n      b.addEventListener('click', () => {\n        seg.querySelectorAll('button').forEach(x => x.classList.remove('active'));\n        b.classList.add('active');\n        applyControl(ctrl, val); clearPresetActive();\n      });\n      seg.appendChild(b);\n    });\n    row.appendChild(seg);\n    row._set = (v) => {\n      seg.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.v === String(v)));\n    };\n\n  } else if(ctrl.type === 'select'){\n    row.innerHTML = `<div class=\"ctrl-top\"><label>${ctrl.label}<\u002Flabel><\u002Fdiv>`;\n    const sel = document.createElement('select');\n    ctrl.options.forEach(o => {\n      const opt = document.createElement('option'); opt.value = o; opt.textContent = o;\n      if(o === ctrl.def) opt.selected = true; sel.appendChild(opt);\n    });\n    sel.addEventListener('change', () => { applyControl(ctrl, sel.value); clearPresetActive(); });\n    row.appendChild(sel);\n    row._set = (v) => { sel.value = v; };\n\n  } else if(ctrl.type === 'toggle'){\n    row.innerHTML = `<div class=\"ctrl-top\"><label>${ctrl.label}<\u002Flabel><\u002Fdiv>`;\n    const top = row.querySelector('.ctrl-top');\n    const t = document.createElement('button'); t.className = 'tgl' + (ctrl.def ? ' on' : '');\n    t.addEventListener('click', () => {\n      t.classList.toggle('on');\n      applyControl(ctrl, t.classList.contains('on')); clearPresetActive();\n    });\n    top.appendChild(t);\n    row._set = (v) => { t.classList.toggle('on', !!v); };\n  }\n\n  return row;\n}\n\n/* map ctrl id -> row element for programmatic set */\nfunction rowFor(id){ return panelBody.querySelector(`[data-ctrl=\"${id}\"]`); }\nfunction setControlValue(id, v){\n  const row = rowFor(id);\n  if(row && row._set) row._set(v);\n  state[id] = v;\n}\n\n/* ============================================================\n   PRESET / RANDOM / RESET / EXPORT\n============================================================ */\nfunction findCtrl(id){\n  for(const s of SECTIONS) for(const c of s.controls) if(c.id===id) return c;\n  return null;\n}\n\nfunction applyPreset(name, chipEl){\n  const p = PRESETS[name];\n  // apply in two passes: simple vars first, dependent (apply fns) after\n  Object.entries(p).forEach(([id, val]) => {\n    const ctrl = findCtrl(id); if(!ctrl) return;\n    setControlValue(id, val);\n    applyControl(ctrl, val);\n  });\n  // ensure dependent visuals consistent\n  updateBackdrop(); updateBodyShadow(state.bodyShadow); updateWideKey(state.wideKey);\n  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));\n  if(chipEl) chipEl.classList.add('active');\n  document.getElementById('stageMeta').textContent = `${name.toLowerCase()} · 340×—`;\n}\n\nfunction clearPresetActive(){\n  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));\n  document.getElementById('stageMeta').textContent = `custom · 340×—`;\n}\n\nfunction applyAll(values){\n  Object.entries(values).forEach(([id, val]) => {\n    const ctrl = findCtrl(id); if(!ctrl) return;\n    setControlValue(id, val);\n    applyControl(ctrl, val);\n  });\n  updateBackdrop(); updateBodyShadow(state.bodyShadow); updateWideKey(state.wideKey);\n}\n\nconst rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;\nconst pick = arr => arr[Math.floor(Math.random()*arr.length)];\nfunction randHex(l, c, h){\n  // generate via hsl-ish for tasteful results\n  const hue = h ?? rand(0,360);\n  const sat = c ?? rand(30,90);\n  const lig = l ?? rand(20,80);\n  return hslToHex(hue, sat, lig);\n}\nfunction hslToHex(h,s,l){\n  s/=100; l/=100;\n  const k = n => (n + h/30) % 12;\n  const a = s*Math.min(l,1-l);\n  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));\n  const to = x => Math.round(255*x).toString(16).padStart(2,'0');\n  return `#${to(f(0))}${to(f(8))}${to(f(4))}`;\n}\n\nfunction randomize(){\n  const dark = Math.random() < 0.5;\n  const baseHue = rand(0,360);\n  const accentHue = (baseHue + rand(120,240)) % 360;\n  const v = {\n    bgStyle: pick(['solid','gradient','grid','gradient']),\n    bg:  dark ? randHex(rand(8,18), rand(10,40), baseHue) : randHex(rand(82,94), rand(8,30), baseHue),\n    bg2: dark ? randHex(rand(14,26), rand(10,45), (baseHue+40)%360) : randHex(rand(80,92), rand(10,35), (baseHue+40)%360),\n    body: dark ? randHex(rand(12,22), rand(6,28), baseHue) : randHex(rand(92,99), rand(2,14), baseHue),\n    bodyRadius: rand(0,52), bodyPad: rand(14,30), bodyShadow: rand(1,5), bodyBorderW: pick([0,0,1,2,3]),\n    bodyBorderC: dark ? randHex(rand(25,45),30,baseHue) : randHex(rand(5,30),40,baseHue),\n    dispBg: dark ? randHex(rand(5,14), rand(8,30), baseHue) : randHex(rand(90,99), rand(2,16), baseHue),\n    dispText: dark ? randHex(rand(78,95), rand(20,80), accentHue) : randHex(rand(12,30), rand(10,60), baseHue),\n    dispH: rand(100,160), dispRadius: rand(0,30), dispAlign: pick(['right','right','left','center']),\n    dispFont: pick(FONT_KEYS), dispSize: rand(42,62), secondary: Math.random()<0.8,\n    btnBg: dark ? randHex(rand(16,30), rand(6,30), baseHue) : randHex(rand(90,100), rand(2,18), baseHue),\n    opBg: randHex(rand(45,65), rand(45,90), accentHue),\n    eqBg: randHex(rand(45,65), rand(50,95), (accentHue+rand(0,40))%360),\n    fnBg: dark ? randHex(rand(22,38), rand(6,28), baseHue) : randHex(rand(82,92), rand(4,20), baseHue),\n    btnText: dark ? randHex(rand(82,96), rand(4,30), baseHue) : randHex(rand(12,28), rand(4,40), baseHue),\n    accentText: dark ? randHex(rand(4,14),10,0) : randHex(rand(92,100),5,0),\n    shape: pick(['sharp','soft','soft','pill','circle']),\n    btnGap: rand(2,16), btnH: rand(50,76), btnFont: pick(FONT_KEYS),\n    btnWeight: pick(['300','400','500','700']), btnSize: rand(18,28),\n    btnBorderW: pick([0,0,0,1,2]), btnBorderC: dark ? randHex(30,30,baseHue) : randHex(15,30,baseHue),\n    btnStyle: pick(['flat','flat','raised','neu']), press: pick(['push','push','glow','none']),\n    wideKey: pick(['zero','zero','equals','none']),\n  };\n  applyAll(v);\n  clearPresetActive();\n}\n\nfunction exportCSS(){\n  const order = [\n    ['--body','body'],['--body-radius','bodyRadius','px'],['--body-pad','bodyPad','px'],\n    ['--body-border-w','bodyBorderW','px'],['--body-border-c','bodyBorderC'],\n    ['--disp-bg','dispBg'],['--disp-text','dispText'],['--disp-h','dispH','px'],\n    ['--disp-radius','dispRadius','px'],['--disp-align','dispAlign'],['--disp-size','dispSize','px'],\n    ['--btn-bg','btnBg'],['--op-bg','opBg'],['--eq-bg','eqBg'],['--fn-bg','fnBg'],\n    ['--btn-text','btnText'],['--accent-text','accentText'],['--btn-radius','btnRadius','px'],\n    ['--btn-gap','btnGap','px'],['--btn-h','btnH','px'],['--btn-weight','btnWeight'],['--btn-size','btnSize','px'],\n    ['--btn-border-w','btnBorderW','px'],['--btn-border-c','btnBorderC'],\n  ];\n  let lines = ['.calculator {'];\n  order.forEach(([cssvar, id, unit]) => {\n    if(state[id] !== undefined) lines.push(`  ${cssvar}: ${state[id]}${unit||''};`);\n  });\n  lines.push(`  --disp-font: ${FONTS[state.dispFont]};`);\n  lines.push(`  --btn-font: ${FONTS[state.btnFont]};`);\n  lines.push(`  --body-shadow: ${getComputedStyle(calc).getPropertyValue('--body-shadow').trim()};`);\n  lines.push('}');\n  const css = lines.join('\\n');\n  navigator.clipboard?.writeText(css).then(()=>toast('CSS copied to clipboard'), ()=>toast('Copy failed'));\n}\n\nlet toastTimer;\nfunction toast(msg){\n  const t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);\n}\n\n/* ============================================================\n   CALCULATOR ENGINE\n============================================================ */\nconst Calc = (() => {\n  let cur = '0', prev = null, op = null, fresh = true, expr = '';\n  const primary = document.getElementById('dispPrimary');\n  const secondary = document.getElementById('dispSecondary');\n  const opSym = { '/':'÷', '*':'×', '-':'−', '+':'+' };\n\n  function fmt(n){\n    if(n === '' ) return '0';\n    if(typeof n === 'string' && (n.endsWith('.') )) {\n      const [i] = n.split('.');\n      return group(i) + '.';\n    }\n    let num = typeof n === 'number' ? n : parseFloat(n);\n    if(!isFinite(num)) return 'Error';\n    if(typeof n === 'string' && n.includes('.')){\n      const [i, d] = n.split('.');\n      return group(i) + '.' + d;\n    }\n    // round long floats\n    let s = num.toString();\n    if(s.includes('e')) return s;\n    if(s.includes('.')){\n      num = Math.round(num*1e10)/1e10;\n      s = num.toString();\n      const [i, d] = s.split('.');\n      return group(i) + '.' + d;\n    }\n    return group(s);\n  }\n  function group(intStr){\n    const neg = intStr.startsWith('-');\n    const digits = neg ? intStr.slice(1) : intStr;\n    return (neg?'-':'') + digits.replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n  }\n\n  function render(){\n    primary.textContent = fmt(cur);\n    secondary.textContent = expr || '\\u00A0';\n  }\n\n  function inputNum(d){\n    if(fresh){ cur = d; fresh = false; }\n    else { if(cur === '0') cur = d; else if(cur.replace(/[-.]/g,'').length < 12) cur += d; }\n    render();\n  }\n  function inputDot(){\n    if(fresh){ cur = '0.'; fresh = false; }\n    else if(!cur.includes('.')) cur += '.';\n    render();\n  }\n  function clear(){ cur='0'; prev=null; op=null; fresh=true; expr=''; render(); }\n  function sign(){ if(cur!=='0') cur = cur.startsWith('-') ? cur.slice(1) : '-'+cur; render(); }\n  function percent(){ cur = (parseFloat(cur)/100).toString(); render(); }\n\n  function compute(a,b,o){\n    a=parseFloat(a); b=parseFloat(b);\n    switch(o){ case '+':return a+b; case '-':return a-b; case '*':return a*b; case '/':return b===0?NaN:a/b; }\n    return b;\n  }\n\n  function chooseOp(o){\n    if(op && !fresh){\n      const r = compute(prev, cur, op);\n      cur = r.toString(); prev = cur;\n    } else { prev = cur; }\n    op = o; fresh = true;\n    expr = `${fmt(prev)} ${opSym[o]}`;\n    render();\n  }\n  function equals(){\n    if(op === null) return;\n    const r = compute(prev, cur, op);\n    expr = `${fmt(prev)} ${opSym[op]} ${fmt(cur)} =`;\n    cur = (isFinite(r)? r : NaN).toString();\n    if(cur==='NaN') cur='Error';\n    op = null; prev = null; fresh = true;\n    render();\n  }\n\n  render();\n  return { inputNum, inputDot, clear, sign, percent, chooseOp, equals };\n})();\n\ndocument.getElementById('keys').addEventListener('click', e => {\n  const b = e.target.closest('.btn'); if(!b) return;\n  const a = b.dataset.act;\n  if(a==='num') Calc.inputNum(b.dataset.n);\n  else if(a==='dot') Calc.inputDot();\n  else if(a==='clear') Calc.clear();\n  else if(a==='sign') Calc.sign();\n  else if(a==='percent') Calc.percent();\n  else if(a==='op') Calc.chooseOp(b.dataset.op);\n  else if(a==='equals') Calc.equals();\n});\n\n/* keyboard */\nwindow.addEventListener('keydown', e => {\n  const k = e.key;\n  if(/[0-9]/.test(k)) Calc.inputNum(k);\n  else if(k==='.') Calc.inputDot();\n  else if(k==='+'||k==='-'||k==='*'||k==='/') Calc.chooseOp(k);\n  else if(k==='Enter'||k==='=') { e.preventDefault(); Calc.equals(); }\n  else if(k==='Escape') Calc.clear();\n  else if(k==='%') Calc.percent();\n});\n\n/* ============================================================\n   INIT\n============================================================ */\nrenderPresets();\nrenderSections();\napplyPreset('Classic', document.querySelector('.chip'));\n\ndocument.getElementById('btnRandom').addEventListener('click', randomize);\ndocument.getElementById('btnReset').addEventListener('click', () => applyPreset('Classic', document.querySelector('.chip')));\ndocument.getElementById('btnExport').addEventListener('click', exportCSS);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
